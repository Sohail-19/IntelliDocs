# The scripted timing pilot also uses compose.yml. This overlay is only for Playwright.
services:
  core:
    environment:
      INTELLIDOCS_ENV: production
      DEMO_MODE: "true"
      LLM_ENABLED: "true"
      CORE_CORS_ORIGINS: ${DEMO_WEB_URL}
  intelligence:
    environment:
      INTELLIDOCS_ENV: production
      DEMO_MODE: "true"
      LLM_ENABLED: "true"
  web:
    build:
      args:
        VITE_API_URL: /
    environment:
      CORE_PORT: ${CORE_PORT}
    ports: !override
      - "127.0.0.1:${WEB_PORT}:8443"
    volumes:
      - ./e2e/browser.conf.template:/etc/nginx/templates/browser.conf.template:ro
      - ${E2E_TLS_DIR}/cert.pem:/run/e2e-tls/cert.pem:ro
      - ${E2E_TLS_DIR}/key.pem:/run/e2e-tls/key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/"]
