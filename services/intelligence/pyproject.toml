[project]
name = "intellidocs-intelligence"
version = "0.1.0"
description = "IntelliDocs document intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pyyaml>=6,<7",
  "qdrant-client>=1.12,<1.13",
  "portalocker>=2.7,<3",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
bge-m3 = ["FlagEmbedding>=1.3.5,<2"]
sentence-transformers = ["sentence-transformers>=3.4,<7"]
formats = ["python-docx>=1.2,<2", "extract-msg>=0.55,<1"]
parsing = ["pypdf>=5,<7", "pycountry>=24.6,<25", "langid>=1.1.6,<2"]
tesseract = ["pypdf>=5,<7", "pycountry>=24.6,<25", "langid>=1.1.6,<2", "pypdfium2>=4.30,<6", "pillow>=11,<13"]
docling = ["docling>=2.48,<3", "pypdf>=5,<7", "pycountry>=24.6,<25", "langid>=1.1.6,<2"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "pypdf>=5,<7",
  "pycountry>=24.6,<25",
  "langid>=1.1.6,<2",
  "pypdfium2>=4.30,<6",
  "pillow>=11,<13",
  "python-docx>=1.2,<2",
  "extract-msg>=0.55,<1",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "app"]

[tool.hatch.build.targets.wheel]
packages = ["src/intellidocs_intelligence", "app"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
