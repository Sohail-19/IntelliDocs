{
  "openapi": "3.1.0",
  "info": { "title": "IntelliDocs Intelligence API", "version": "v1" },
  "paths": {
    "/health": {
      "get": {
        "responses": {
          "200": { "description": "Service is healthy" }
        }
      }
    },
    "/v1/ingest": {
      "post": {
        "requestBody": { "required": true, "content": { "multipart/form-data": { "schema": { "$ref": "../schemas/ingest-request.v1.schema.json" } } } },
        "responses": {
          "202": { "description": "Document parsed; optional index results included", "content": { "application/json": { "schema": { "$ref": "../schemas/ingest-response.v1.schema.json" } } } },
          "503": { "description": "Parsing succeeded but optional indexing failed; stored document remains available", "content": { "application/json": { "schema": { "$ref": "../schemas/ingest-response.v1.schema.json" } } } }
        }
      }
    },
    "/v1/index": {
      "post": {
        "description": "Index a stored parsed document, reusing cached embeddings when content and embedding configuration match.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "../schemas/index-request.v1.schema.json" } } } },
        "responses": {
          "200": { "description": "Document indexed", "content": { "application/json": { "schema": { "$ref": "../schemas/index-result.v1.schema.json" } } } }
        }
      }
    },
    "/v1/search": {
      "post": {
        "description": "Retrieve and rerank chunks with source citations. Set debug=true in the request body to include stage timings.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "../schemas/search-request.v1.schema.json" } } } },
        "responses": {
          "200": { "description": "Grounded search results", "content": { "application/json": { "schema": { "$ref": "../schemas/search-response.v1.schema.json" } } } }
        }
      }
    },
    "/v1/answer": {
      "post": {
        "description": "Contract for a grounded answer with claim-level citations and verification status.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "../schemas/answer-request.v1.schema.json" } } } },
        "responses": {
          "200": { "description": "Answer with claims and abstention metadata", "content": { "application/json": { "schema": { "$ref": "../schemas/answer.v1.schema.json" } } } }
        }
      }
    },
    "/v1/extract-obligations": {
      "post": {
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "../schemas/extract-obligations-request.v1.schema.json" } } } },
        "responses": {
          "200": { "description": "Extracted obligations", "content": { "application/json": { "schema": { "$ref": "../schemas/extract-obligations-response.v1.schema.json" } } } }
        }
      }
    }
  }
}
