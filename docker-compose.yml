services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "${QDRANT_PORT}:6333"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-eng,hin}
        PARSING_EXTRAS: ${PARSING_EXTRAS:-tesseract,formats}
    environment:
      INTELLIGENCE_PORT: ${INTELLIGENCE_PORT}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      STORAGE_DIR: ${STORAGE_DIR:-/data/uploads}
      ORG_CONFIG_DIR: ${ORG_CONFIG_DIR:-/config/orgs}
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DOCUMENT_PROMPT: ${EMBEDDING_DOCUMENT_PROMPT:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
      CHUNK_TOKEN_COUNT_METHOD: ${CHUNK_TOKEN_COUNT_METHOD:-unicode_words}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
    volumes:
      - intelligence_uploads:${STORAGE_DIR:-/data/uploads}
    ports:
      - "${INTELLIGENCE_PORT}:${INTELLIGENCE_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:${INTELLIGENCE_PORT}/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      CORE_PORT: ${CORE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTELLIGENCE_URL: http://intelligence:${INTELLIGENCE_PORT}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${CORE_PORT}/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  intelligence_uploads:
