services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:${QDRANT_PORT}:6333"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-eng,hin}
        PARSING_EXTRAS: ${PARSING_EXTRAS:-tesseract,formats}
        PROVISION_E5_SMALL: ${PROVISION_E5_SMALL:-false}
    environment:
      INTELLIGENCE_PORT: ${INTELLIGENCE_PORT}
      INTELLIDOCS_ENV: ${INTELLIDOCS_ENV:-development}
      INTELLIDOCS_INTERNAL_KEY: "${INTELLIDOCS_INTERNAL_KEY:-}"
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DEMO_LLM_CALLS_PER_USER_DAY: ${DEMO_LLM_CALLS_PER_USER_DAY:-20}
      DEMO_LLM_CALLS_GLOBAL_DAY: ${DEMO_LLM_CALLS_GLOBAL_DAY:-100}
      DEMO_RETENTION_DAYS: ${DEMO_RETENTION_DAYS:-7}
      DEMO_SWEEP_INTERVAL_SECONDS: ${DEMO_SWEEP_INTERVAL_SECONDS:-3600}
      INTELLIGENCE_MAX_JSON_BYTES: ${INTELLIGENCE_MAX_JSON_BYTES:-524288}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      GENERATION_MAX_RETRIES: ${GENERATION_MAX_RETRIES:-2}
      EXTRACTION_BATCH_SIZE: ${EXTRACTION_BATCH_SIZE:-4}
      EXTRACTION_MAX_CHUNKS_PER_DOCUMENT: ${EXTRACTION_MAX_CHUNKS_PER_DOCUMENT:-20}
      EXTRACTION_MAX_RETRIES: ${EXTRACTION_MAX_RETRIES:-1}
      EXTRACTION_FUZZY_THRESHOLD: ${EXTRACTION_FUZZY_THRESHOLD:-1.0}
      EXTRACTION_CONFIDENCE_WEIGHTS: "${EXTRACTION_CONFIDENCE_WEIGHTS:-}"
      LLM_CACHE_DIR: ${LLM_CACHE_DIR:-}
      VERIFICATION_FUZZY_THRESHOLD: ${VERIFICATION_FUZZY_THRESHOLD:-1.0}
      VERIFICATION_SUPPORT_CHECK: ${VERIFICATION_SUPPORT_CHECK:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_UPLOAD_PAGES: ${MAX_UPLOAD_PAGES:-25}
      STORAGE_DIR: ${STORAGE_DIR:-/data/uploads}
      ORG_CONFIG_DIR: ${ORG_CONFIG_DIR:-/config/orgs}
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fake}
      EMBEDDING_LIGHTWEIGHT: ${EMBEDDING_LIGHTWEIGHT:-false}
      EMBEDDING_LIGHTWEIGHT_MODEL: ${EMBEDDING_LIGHTWEIGHT_MODEL:-/opt/models/multilingual-e5-small}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DOCUMENT_PROMPT: ${EMBEDDING_DOCUMENT_PROMPT:-}
      EMBEDDING_QUERY_PROMPT: ${EMBEDDING_QUERY_PROMPT:-}
      SPARSE_EMBEDDING_BACKEND: ${SPARSE_EMBEDDING_BACKEND:-auto}
      BM25_K1: ${BM25_K1:-1.2}
      BM25_B: ${BM25_B:-0.75}
      BM25_AVG_DOC_LENGTH: ${BM25_AVG_DOC_LENGTH:-400}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
      CHUNK_TOKEN_COUNT_METHOD: ${CHUNK_TOKEN_COUNT_METHOD:-unicode_words}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_CANDIDATE_POOL_SIZE: ${RETRIEVAL_CANDIDATE_POOL_SIZE:-50}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-2}
      RETRIEVAL_DEFAULT_TOP_K: ${RETRIEVAL_DEFAULT_TOP_K:-10}
      RELATION_CANDIDATE_LIMIT: ${RELATION_CANDIDATE_LIMIT:-10}
      RELATION_QUERY_CHUNKS: ${RELATION_QUERY_CHUNKS:-24}
      RELATION_CHUNK_HITS: ${RELATION_CHUNK_HITS:-12}
      RELATION_MIN_SIMILARITY: ${RELATION_MIN_SIMILARITY:-0}
      RELATION_MAX_PAIRS: ${RELATION_MAX_PAIRS:-10}
      RELATION_PAIRS_PER_CANDIDATE: ${RELATION_PAIRS_PER_CANDIDATE:-2}
      RELATION_MAX_RETRIES: ${RELATION_MAX_RETRIES:-1}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
    volumes:
      - intelligence_uploads:${STORAGE_DIR:-/data/uploads}
    ports:
      - "127.0.0.1:${INTELLIGENCE_PORT}:${INTELLIGENCE_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:${INTELLIGENCE_PORT}/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      CORE_PORT: ${CORE_PORT}
      INTELLIDOCS_ENV: ${INTELLIDOCS_ENV:-development}
      INTELLIDOCS_INTERNAL_KEY: "${INTELLIDOCS_INTERNAL_KEY:-}"
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DEMO_UPLOADS_PER_USER_DAY: ${DEMO_UPLOADS_PER_USER_DAY:-5}
      DEMO_UPLOADS_GLOBAL_DAY: ${DEMO_UPLOADS_GLOBAL_DAY:-30}
      DEMO_MAX_CONCURRENT_UPLOADS: ${DEMO_MAX_CONCURRENT_UPLOADS:-2}
      DEMO_RETENTION_DAYS: ${DEMO_RETENTION_DAYS:-7}
      DEMO_SWEEP_INTERVAL_SECONDS: ${DEMO_SWEEP_INTERVAL_SECONDS:-3600}
      CORE_MAX_JSON_BYTES: ${CORE_MAX_JSON_BYTES:-32768}
      CORE_TRUST_PROXY_HOPS: ${CORE_TRUST_PROXY_HOPS:-0}
      CORE_CORS_ORIGINS: "${CORE_CORS_ORIGINS:-http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}}"
      TASK_SWEEP_INTERVAL_SECONDS: ${TASK_SWEEP_INTERVAL_SECONDS:-60}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-604800}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-15}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTELLIGENCE_URL: http://intelligence:${INTELLIGENCE_PORT}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${CORE_PORT}/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:${CORE_PORT:-3000}}"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  intelligence_uploads:
