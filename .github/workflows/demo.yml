name: Docker demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            services/core/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix services/core
      - run: npm ci --prefix e2e
      - name: Install Chromium and system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run the demo against Docker Compose
        run: bash e2e/run-compose.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-test-screenshots
          path: e2e/test-results/**/*.png
          if-no-files-found: ignore
