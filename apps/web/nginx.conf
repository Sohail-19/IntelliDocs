server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
